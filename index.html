<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Negocio</title>
<meta name="theme-color" content="#141216">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi Negocio">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
:root{
  --bg:#141216; --surface:#1e1b21; --surface2:#28242c; --line:#36313b;
  --fg:#f5f0f7; --muted:#a69eae;
  --accent:#ff2e93; --accent2:#ffe600;
  --ok:#3ddc84; --bad:#ff5a5a; --on-accent:#ffffff; --on-accent2:#141216;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px calc(96px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{font-weight:800;font-size:24px;line-height:1.1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand::after{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--accent);margin-top:4px}
.gear{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.gear svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2}
h2{font-weight:800;font-size:19px;margin:22px 0 10px}
h2 .hl{background:linear-gradient(transparent 62%,color-mix(in srgb,var(--accent2) 40%,transparent) 62%)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border-radius:12px;padding:10px 12px;min-width:0}
.kpi .l{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kpi .v{font-family:var(--f-num);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.a .v{color:var(--accent)} .kpi.b .v{color:var(--accent2)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pcard{position:relative;background:var(--surface);border:2px solid transparent;border-radius:14px;padding:12px;text-align:left;color:var(--fg);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.pcard .n{font-weight:800;line-height:1.15}
.pcard .p{font-family:var(--f-num);font-size:22px;font-weight:700;color:var(--accent2)}
.pcard .g{font-size:12px;color:var(--muted)} .pcard .g b{color:var(--ok);font-weight:600}
.badge{position:absolute;top:-8px;right:-6px;background:var(--accent);color:var(--on-accent);font-family:var(--f-num);font-weight:700;font-size:16px;min-width:28px;height:28px;border-radius:14px;display:grid;place-items:center;padding:0 6px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px}
.chip.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.chip.low{background:color-mix(in srgb,var(--accent2) 18%,transparent);color:var(--accent2)}
.chip.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.cart{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cart-in{max-width:608px;margin:0 auto;background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 -6px 24px rgba(0,0,0,.45)}
.cart-row{display:flex;align-items:center;gap:8px;font-size:14px}
.cart-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step{display:flex;align-items:center;gap:6px}
.step button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:18px;cursor:pointer}
.cart-tot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cart-tot .t{font-family:var(--f-num);font-size:26px;font-weight:700}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;background:var(--surface2);color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.yellow{background:var(--accent2);color:var(--on-accent2)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.btn:focus-visible,.pcard:focus-visible,.gear:focus-visible{outline:3px solid var(--accent2);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1 1 140px;min-width:0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;text-transform:none;letter-spacing:0}
input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
.list{display:flex;flex-direction:column;background:var(--surface);border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .main{flex:1;min-width:0}
.li .t1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t2{font-size:12px;color:var(--muted)}
.li .r{text-align:right;white-space:nowrap}
.li .big{font-family:var(--f-num);font-size:20px;font-weight:700}
.li.click{cursor:pointer}
.lnk{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;padding:4px}
.lnk.danger{color:var(--bad);font-weight:700}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--surface2);color:var(--fg)}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;max-width:140px;height:64px;border:0;background:none;color:var(--muted);font:inherit;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent2)}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--bg);border-top:3px solid var(--accent);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:90vh;overflow:auto;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.sheet-card h3{font-weight:800;font-size:20px;margin:0}
.rec{display:grid;grid-template-columns:1fr 90px 34px;gap:8px;align-items:center;font-size:14px}
.rec input{padding:8px;text-align:center}
.toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--accent2);color:var(--on-accent2);font-weight:800;padding:10px 16px;border-radius:999px;max-width:calc(100% - 32px)}
.welcome{display:flex;flex-direction:column;gap:14px;padding-top:20px}
.welcome h1{font-size:30px;line-height:1.1;margin:0}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:2px solid transparent;border-radius:14px;padding:14px;cursor:pointer;color:var(--fg);font:inherit;text-align:left}
.opt.sel{border-color:var(--accent)}
.opt b{display:block;font-size:16px}
.brandwrap{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;border-radius:12px;object-fit:cover;flex:0 0 auto;background:var(--surface)}
.logoedit{display:flex;align-items:center;gap:12px}
.logoedit .prev{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--surface);border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;flex:0 0 auto}
.temas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tema{border:2px solid;border-radius:12px;padding:10px 8px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.tema .dots{display:flex;gap:4px}.tema .dots i{width:14px;height:14px;border-radius:50%;display:block}
input[type=color]{height:44px;padding:4px;cursor:pointer}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:0 0 auto;font-weight:800;font-size:14px;color:var(--on-accent);margin-top:1px}
.opt.sel .chk{background:var(--accent);border-color:var(--accent)}
.vgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.vbtn{position:relative;background:var(--surface);border:2px solid transparent;border-radius:12px;padding:12px;color:var(--fg);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;min-width:0}
.vbtn.sel{border-color:var(--accent)}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.pnav b{font-size:17px}
.pnav .btn{padding:8px 16px;font-size:20px;line-height:1}
.paygrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pay{position:relative;cursor:pointer}.pay input{position:absolute;opacity:0;pointer-events:none}
.pay span{display:block;text-align:center;padding:10px 4px;border-radius:10px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.pay input:checked+span{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.pay input:focus-visible+span{outline:3px solid var(--accent2)}
.recibo-prev{background:#fff;color:#151513;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.recibo-prev .small.muted{color:#6b6a63}
.rp-head{display:flex;gap:10px;align-items:center;padding-bottom:8px;border-bottom:2px solid var(--accent);margin-bottom:4px}
.rp-head img{width:40px;height:40px;border-radius:8px;object-fit:cover}
.rp-row{display:flex;justify-content:space-between;gap:10px}.rp-row span:first-child{min-width:0}
.rp-tot{font-weight:800;font-size:17px;border-top:1px solid #e2e1da;padding-top:6px;margin-top:2px}
.aviso{background:color-mix(in srgb,var(--accent2) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--accent2) 50%,transparent);border-radius:12px;padding:10px 12px;font-size:13px}
.cajastrip{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;color:var(--fg);font:inherit;text-align:left;cursor:pointer}
.cajastrip.open{border:1px solid color-mix(in srgb,var(--ok) 55%,transparent);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.cajastrip > span{display:flex;flex-direction:column;gap:2px;min-width:0}.cajastrip .r{align-items:flex-end;text-align:right}
.chkline{display:flex;gap:10px;align-items:center;font-size:14px;cursor:pointer}.chkline input{width:20px;height:20px;accent-color:var(--accent)}
.dropzone{border:2px dashed var(--line);border-radius:14px;padding:10px;transition:border-color .15s,background .15s}
.dropzone.over{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent)}
.pasos{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.newing{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.newing .row > *{flex:1 1 90px}
.fline{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.fline .row > *{flex:1 1 90px}
.fline-foot{display:flex;align-items:center;gap:10px}.fline-foot .small{flex:1;min-width:0}.fline-foot .num{font-weight:700}
.ftotal{display:flex;justify-content:space-between;align-items:center;background:var(--surface2);border-radius:12px;padding:12px 14px}.ftotal b{font-size:22px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top" hidden><div class="brandwrap"><img id="logo" class="logo" alt="" hidden><div class="brand" id="brand">Mi negocio</div></div>
    <button class="gear" data-act="ajustes" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></header>
  <main id="view"></main>
</div>
<div id="cart" class="cart" hidden></div>
<nav class="tabs" id="tabs" hidden>
  <button data-tab="vender" class="on"><svg viewBox="0 0 24 24"><path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/></svg>Vender</button>
  <button data-tab="inventario"><svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>Inventario</button>
  <button data-tab="productos"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg>Productos</button>
  <button data-tab="gastos"><svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z"/><path d="M4 10h16"/><path d="M8 15h3"/></svg>Gastos</button>
  <button data-tab="resumen"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
</nav>
<div id="sheet" class="sheet" hidden><div class="sheet-card" id="sheetCard" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="toast" hidden></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="logoFile" accept="image/*" hidden>
<input type="file" id="excelFile" accept=".xlsx,.xls,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel,text/csv" hidden>
<script src="jspdf.umd.min.js"></script>

<script>
/* ===== Almacenamiento local ===== */
const KEY='mi-negocio-v1';
const blank=()=>({cfg:{nombre:'',reservaPct:10,ventasMes:0},ins:{},prod:{},fijos:{},movs:[],cajas:[]});
let D=blank();
try{const raw=localStorage.getItem(KEY);if(raw)D={...blank(),...JSON.parse(raw)}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));return true}catch(e){toast('No se pudo guardar en este celular.');return false}}
try{navigator.storage?.persist?.()}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ===== Colores ===== */
const TEMAS={
  neon:{nombre:'Neón',dark:1,bg:'#141216',surface:'#1e1b21',surface2:'#28242c',line:'#36313b',fg:'#f5f0f7',muted:'#a69eae',accent:'#ff2e93',accent2:'#ffe600',ok:'#3ddc84',bad:'#ff5a5a'},
  pastel:{nombre:'Pastel',dark:0,bg:'#fff6f8',surface:'#ffffff',surface2:'#fbe7ee',line:'#f0d3dd',fg:'#2b1d22',muted:'#8a6f78',accent:'#e0558a',accent2:'#f4b740',ok:'#1f9d5c',bad:'#d93a3a'},
  chocolate:{nombre:'Chocolate',dark:1,bg:'#1c1411',surface:'#271c18',surface2:'#33251f',line:'#45332b',fg:'#f7ece4',muted:'#b39d90',accent:'#e8925a',accent2:'#f3d27a',ok:'#5fd38d',bad:'#ff6b5e'},
  menta:{nombre:'Menta',dark:0,bg:'#f3faf7',surface:'#ffffff',surface2:'#e0f2ea',line:'#c9e6d9',fg:'#16302a',muted:'#5f7d74',accent:'#14a37f',accent2:'#ffb547',ok:'#14a37f',bad:'#d94848'},
  oceano:{nombre:'Océano',dark:1,bg:'#0f1622',surface:'#17202e',surface2:'#1f2a3b',line:'#2b384c',fg:'#eef3fa',muted:'#94a3b8',accent:'#3b9eff',accent2:'#5eead4',ok:'#4ade80',bad:'#f87171'},
  clasico:{nombre:'Clásico',dark:0,bg:'#f6f6f4',surface:'#ffffff',surface2:'#ececea',line:'#dddcd8',fg:'#1c1c1a',muted:'#6e6d68',accent:'#1c1c1a',accent2:'#e4b43c',ok:'#2f9e5b',bad:'#d0453b'}
};
const textoSobre=hex=>{const n=parseInt(String(hex).slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150?'#141216':'#ffffff'};
function aplicarTema(){
  const base=TEMAS[D.cfg.tema]||TEMAS.neon,t={...base,...(D.cfg.colores||{})},r=document.documentElement.style;
  ['bg','surface','surface2','line','fg','muted','accent','accent2','ok','bad'].forEach(k=>r.setProperty('--'+k,t[k]));
  r.setProperty('--on-accent',textoSobre(t.accent));r.setProperty('--on-accent2',textoSobre(t.accent2));
  r.setProperty('color-scheme',t.dark?'dark':'light');
  document.querySelector('meta[name=theme-color]')?.setAttribute('content',t.bg);
}

/* ===== Plantillas ===== */
const FIJOS_BASE=[['Arriendo del local',''],['Servicios (luz, agua, gas)',''],['Internet y celular',''],['Mi sueldo',''],['Publicidad en redes',''],['Permisos, impuestos y contador','Valor del año ÷ 12'],['Desgaste de equipos','Precio del equipo ÷ meses que dura']];
const MODS={
  recetas:['Productos que preparo','Postres, comidas o bebidas con receta. Al vender descuenta cada ingrediente.'],
  reventa:['Productos que compro y revendo','Accesorios, maquillaje, gafas, suplementos, licores. Sin receta: costo, precio y listo. Con tonos o sabores si los tienen.'],
  ropa:['Ropa y calzado','Por tallas y colores. Cada talla lleva su propio inventario.']};
const mods=()=>D.cfg.modulos||{recetas:true,reventa:true,ropa:false};
const EJ_RECETAS={

  {nombre:'Labial mate',categoria:'Maquillaje',precio:15000,colores:'Rojo, Nude, Rosa'},{nombre:'Brillo labial',categoria:'Maquillaje',precio:12000,colores:'Transparente, Rosa, Cereza'}];
const EJ_ROPA=[{nombre:'Camiseta básica',categoria:'Ropa',precio:35000,tallas:'S, M, L',colores:'Negro, Blanco'},{nombre:'Jean',categoria:'Ropa',precio:85000,tallas:'6, 8, 10, 12'}];
const lista=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
function combinaciones(t,c){const T=lista(t),C=lista(c);if(T.length&&C.length)return T.flatMap(a=>C.map(b=>a+' · '+b));return T.length?T:C}
function compraMov(iid,cant,costo){const i=D.ins[iid];D.movs.push({id:uid(),tipo:'compra',fecha:Date.now(),insumoId:iid,nombre:i.nombre,unidad:'und',cant,costoUnit:costo||0,total:cant*(costo||0)})}
function crearReventa(o){
  const pid=uid()+'p',vs=combinaciones(o.tallas,o.colores),costo=+o.costo||0;
  const p={id:pid,tipo:'reventa',nombre:o.nombre,precio:+o.precio||0,categoria:o.categoria||'Productos',receta:{},tallas:o.tallas||'',colores:o.colores||'',orden:o.orden??60};
  if(!vs.length){const iid=uid();D.ins[iid]={id:iid,nombre:o.nombre,unidad:'und',costo,minimo:2,orden:60,grupo:pid};p.receta={[iid]:1};if(+o.cant?.[0])compraMov(iid,+o.cant[0],costo)}
  else p.variantes=vs.map((vn,i)=>{const iid=uid()+'v'+i;D.ins[iid]={id:iid,nombre:o.nombre+' · '+vn,variante:vn,unidad:'und',costo,minimo:1,orden:60,grupo:pid};if(+o.cant?.[i])compraMov(iid,+o.cant[i],costo);return{nombre:vn,ins:iid}});
  D.prod[pid]=p;return pid;
}
function iniciar(nombre,modulos,ejemplos){
  D=blank();D.cfg.nombre=nombre;D.cfg.modulos={...modulos};
  FIJOS_BASE.forEach(([c,n],i)=>{const id=uid()+i;D.fijos[id]={id,concepto:c,valor:0,nota:n,orden:i}});
  if(ejemplos){
    if(modulos.recetas){EJ_RECETAS.ins.forEach(([id,nombre,unidad],i)=>D.ins[id]={id,nombre,unidad,costo:0,minimo:unidad==='und'?3:200,orden:i});
      EJ_RECETAS.prod.forEach(([nombre,categoria,precio,receta],i)=>{const id=uid()+i;D.prod[id]={id,nombre,categoria,precio,receta,orden:i}})}
    if(modulos.reventa)EJ_REVENTA.forEach((o,i)=>crearReventa({...o,orden:20+i}));
    if(modulos.ropa)EJ_ROPA.forEach((o,i)=>crearReventa({...o,orden:40+i}));
  }
  save();
}

const S={mesOff:0,anio:new Date().getFullYear(),tab:'vender',cart:{},period:'mes',confirmDel:null,wMods:{recetas:false,reventa:false,ropa:false},wEj:false};
const $=s=>document.querySelector(s);
const money=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n||0)).toLocaleString('es-CO');
const moneyU=n=>{n=+n||0;return '$'+n.toLocaleString('es-CO',{maximumFractionDigits:n<100?2:0})};
const fmtIn=n=>{const x=Math.round(+n||0);return x?x.toLocaleString('es-CO'):''};
const numIn=v=>+String(v??'').replace(/\D/g,'')||0;
const qty=n=>(+n||0).toLocaleString('es-CO',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sorted=o=>Object.values(o).sort((a,b)=>(a.orden??99)-(b.orden??99)||String(a.nombre||a.concepto).localeCompare(b.nombre||b.concepto));
const fmtFecha=ms=>new Date(ms).toLocaleString('es-CO',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
const U=i=>i?.unidad||'und';
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}

function stock(){const st={};for(const id in D.ins)st[id]=0;
  for(const m of D.movs){if(m.tipo==='compra'||m.tipo==='ajuste')st[m.insumoId]=(st[m.insumoId]||0)+(+m.cant||0);
    else if(m.tipo==='venta'&&m.consumo)for(const k in m.consumo)st[k]=(st[k]||0)-(+m.consumo[k]||0)}
  return st}
const esRev=p=>p.tipo==='reventa'||!!p.variantes;
const costoProd=p=>{if(p.variantes){const v=p.variantes.filter(v=>D.ins[v.ins]);return v.length?v.reduce((a,x)=>a+(+D.ins[x.ins].costo||0),0)/v.length:0}let c=0;for(const k in (p.receta||{}))c+=(+p.receta[k]||0)*(+D.ins[k]?.costo||0);return c};
const faltaCosto=p=>p.variantes?p.variantes.some(v=>D.ins[v.ins]&&!(+D.ins[v.ins].costo>0)):Object.keys(p.receta||{}).some(k=>(+p.receta[k]>0)&&!(+D.ins[k]?.costo>0));
function maxPrep(p,st){if(p.variantes)return Math.max(0,p.variantes.reduce((a,v)=>a+(st[v.ins]||0),0));let m=Infinity;for(const k in (p.receta||{})){const q=+p.receta[k];if(q>0)m=Math.min(m,Math.floor((st[k]||0)/q))}return m===Infinity?0:Math.max(0,m)}
const diasMes=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()};
const mesKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
const mesHoy=()=>mesKey(new Date());
const mesNombre=k=>{const [y,m]=k.split('-');return MESES[+m-1]+' '+y};
function valorFijo(f,k=mesHoy()){if(!f.hist)return f.archivado?0:(+f.valor||0);let v=0;for(const kk of Object.keys(f.hist).sort())if(kk<=k)v=+f.hist[kk]||0;return v}
const fijosMes=(k=mesHoy())=>Object.values(D.fijos).reduce((a,f)=>a+valorFijo(f,k),0);
const fijosPeriodo=per=>{const f=fijosMes();return per==='mes'?f:per==='semana'?f/diasMes()*7:f/diasMes()};
function desde(per){const d=new Date();d.setHours(0,0,0,0);if(per==='semana')d.setDate(d.getDate()-6);if(per==='mes')d.setDate(1);return d.getTime()}
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function rango(per,off=0,anio){const now=new Date(),fm=fijosMes();
  if(per==='mes'){const d=new Date(now.getFullYear(),now.getMonth()+off,1),e=new Date(d.getFullYear(),d.getMonth()+1,1);return{t0:+d,t1:+e,fij:fijosMes(mesKey(d)),label:MESES[d.getMonth()]+' '+d.getFullYear(),fijLbl:'mes completo'}}
  if(per==='anio'){const y=anio??now.getFullYear(),n=y<now.getFullYear()?12:y===now.getFullYear()?now.getMonth()+1:0;let fy=0;for(let i=0;i<n;i++)fy+=fijosMes(mesKey(new Date(y,i,1)));return{t0:+new Date(y,0,1),t1:+new Date(y+1,0,1),fij:fy,label:String(y),fijLbl:n+(n===1?' mes':' meses')}}
  const t0=desde(per);return{t0,t1:Infinity,fij:per==='semana'?fm/diasMes()*7:fm/diasMes(),fijLbl:per==='semana'?'7 días':'1 día'}}
function totales(per,rg){const r=rg||rango(per),t0=r.t0;let ventas=0,costo=0,gastos=0,compras=0,n=0;const porProd={};
  for(const m of D.movs){if((m.fecha||0)<t0||(m.fecha||0)>=r.t1)continue;
    if(m.tipo==='venta'){ventas+=+m.total||0;costo+=+m.costo||0;for(const it of (m.items||[])){n+=+it.cant||0;porProd[it.nombre]=(porProd[it.nombre]||0)+(+it.cant||0)}}
    else if(m.tipo==='gasto')gastos+=+m.valor||0;else if(m.tipo==='compra')compras+=+m.total||0}
  return{ventas,costo,gastos,compras,n,porProd,bruta:ventas-costo}}
function reales(r){const t=totales(null,r),fij=r.fij,antes=t.bruta-t.gastos-fij,reserva=antes>0?antes*(+D.cfg.reservaPct||0)/100:0;return{...t,fij,antes,reserva,real:antes-reserva}}
function equilibrio(){const t=totales('mes');let margen=t.n?(t.ventas-t.costo)/t.n:0;
  if(!margen){const ps=Object.values(D.prod).filter(p=>!faltaCosto(p));if(ps.length)margen=ps.reduce((a,p)=>a+p.precio-costoProd(p),0)/ps.length}
  const f=fijosMes(),unidades=margen>0?Math.ceil(f/margen):0,base=+D.cfg.ventasMes||t.n||unidades;
  return{margen,unidades,porDia:unidades?Math.ceil(unidades/diasMes()):0,vendidas:t.n,fijoUnidad:base?f/base:0,base}}
function lineaCart(k){const [pid,iid]=k.split('|'),p=D.prod[pid];if(!p)return null;
  if(iid){const v=p.variantes?.find(v=>v.ins===iid);if(!v||!D.ins[iid])return null;return{p,variante:v.nombre,nombre:p.nombre+' · '+v.nombre,costo:+D.ins[iid].costo||0,consumo:{[iid]:1}}}
  if(p.variantes)return null;return{p,variante:'',nombre:p.nombre,costo:costoProd(p),consumo:p.receta||{}}}
const enCart=pid=>Object.keys(S.cart).filter(k=>k===pid||k.startsWith(pid+'|')).reduce((a,k)=>a+S.cart[k],0);
function nivel(q,min){if(q<=0)return['bad','Agotado'];if(q<=(min||0))return['low','Bajo'];return['ok','OK']}

const cajaAbierta=()=>(D.cajas||[]).find(c=>!c.cerrada)||null;
function cuentaCaja(c){
  const t1=c.cerrada||Infinity,en=m=>(m.fecha||0)>=c.abierta&&(m.fecha||0)<t1;
  let ventasEf=0,nEf=0,gastos=0,compras=0,abonosEf=0;const otros={};
  for(const m of D.movs){for(const a of (m.abonos||[])){if((a.fecha||0)>=c.abierta&&(a.fecha||0)<t1){if((a.pago||'Efectivo')==='Efectivo')abonosEf+=+a.valor||0;else otros['Abono '+a.pago]=(otros['Abono '+a.pago]||0)+(+a.valor||0)}}
    if(!en(m))continue;
    if(m.tipo==='venta'){const pg=m.pago||'Efectivo';if(pg==='Efectivo'){ventasEf+=+m.total||0;nEf++}else otros[pg]=(otros[pg]||0)+(+m.total||0)}
    else if(m.tipo==='gasto'&&m.caja)gastos+=+m.valor||0;
    else if(m.tipo==='compra'&&m.caja)compras+=+m.total||0}
  const ingresos=(c.movs||[]).filter(x=>x.tipo==='ingreso').reduce((a,x)=>a+x.valor,0),retiros=(c.movs||[]).filter(x=>x.tipo==='retiro').reduce((a,x)=>a+x.valor,0);
  return{base:+c.base||0,ventasEf,nEf,abonosEf,gastos,compras,ingresos,retiros,otros,esperado:(+c.base||0)+ventasEf+abonosEf+ingresos-gastos-compras-retiros};
}
const difTxt=d=>Math.abs(d)<1?'<span class="chip ok">Cuadró exacto</span>':d>0?`<span class="chip low">Sobran ${money(d)}</span>`:`<span class="chip bad">Faltan ${money(-d)}</span>`;
const horaCorta=ms=>new Date(ms).toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});
function cajaStrip(){const c=cajaAbierta();

function vCaja(){
  const c=cajaAbierta(),hist=(D.cajas||[]).filter(x=>x.cerrada).sort((a,b)=>b.abierta-a.abierta);
  const back=`<button class="lnk" data-tab="vender" style="padding:0;margin-bottom:6px">‹ Volver a vender</button>`;

  if(!c){const ult=hist[0],sug=ult?Math.max(0,(+ult.conteo||0)-(+ult.retiroCierre||0)):'';
    return back+`<h2 style="margin-top:4px"><span class="hl">Abrir caja</span></h2>
    <div class="list"><div class="li" style="flex-direction:column;align-items:stretch;gap:10px">
      <label class="f">¿Con cuánto efectivo arrancas?<input id="cjBase" type="text" inputmode="numeric" class="money" autocomplete="off" value="${fmtIn(sug)}" placeholder="Ej: 50.000"></label>

  const k=cuentaCaja(c),otros=Object.entries(k.otros);
  return back+`<div class="kpis" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="kpi b"><div class="l">Debe haber</div><div class="v">${money(k.esperado)}</div></div><div class="kpi"><div class="l">Abierta desde</div><div class="v" style="font-size:20px">${horaCorta(c.abierta)}</div></div></div>
  <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="cajaIngreso">+ Ingreso</button><button class="btn ghost" data-act="cajaRetiro">− Retiro</button></div>
  <button class="btn primary block" data-act="cerrarCaja" style="margin-top:8px">Cerrar caja</button>
  <h2><span class="hl">Efectivo en la caja</span></h2><div class="list">${desglose(k)}</div>
  ${otros.length?`<h2><span class="hl">Otros pagos de este turno</span></h2><div class="list">${otros.map(([n,v])=>`<div class="li"><div class="main">${esc(n)}${n==='Fiado'?' <span class="chip low">Por cobrar</span>':''}</div><div class="big num">${money(v)}</div></div>`).join('')}</div><p class="small muted">No están en el cajón, por eso no suman al efectivo.</p>`:''}
  ${(c.movs||[]).length?`<h2><span class="hl">Ingresos y retiros</span></h2><div class="list">${c.movs.slice().reverse().map(x=>`<div class="li"><div class="main"><div class="t1">${x.tipo==='retiro'?'Retiro':'Ingreso'}: ${esc(x.concepto||'')}</div><div class="t2">${horaCorta(x.fecha)}</div></div><div class="r"><div class="num" style="font-size:18px">${x.tipo==='retiro'?'−':'+'}${money(x.valor)}</div><button class="lnk ${S.confirmDel===x.id?'danger':''}" data-delcm="${x.id}">${S.confirmDel===x.id?'¿Borrar? Sí':'Borrar'}</button></div></div>`).join('')}</div>`:''}
  ${hl}`;
}

function cargarXLSX(){return new Promise((ok,no)=>{if(window.XLSX)return ok(window.XLSX);const sc=document.createElement('script');sc.src='xlsx.full.min.js';sc.onload=()=>ok(window.XLSX);sc.onerror=()=>no(new Error('xlsx'));document.head.appendChild(sc)})}
const normH=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim();
function numX(v){if(typeof v==='number')return v;let t=String(v??'').replace(/[$\s]/g,'');if(!t)return 0;
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(t))t=t.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(t))t=t.replace(/,/g,'');else t=t.replace(',','.');
  const n=parseFloat(t);return isFinite(n)?n:0}
function colMap(hdr,defs){const m={};hdr.forEach((h,i)=>{const n=normH(h);for(const [k,keys] of Object.entries(defs))if(m[k]===undefined&&keys.some(x=>n.includes(x))){m[k]=i;break}});return m}
const DEF_PROD={nombre:['producto','nombre','referencia','articulo'],categoria:['categ'],costo:['costo','compra'],precio:['precio','venta','valor'],cantidad:['cant','unidades','stock','existencia'],talla:['talla'],color:['color','tono','sabor','variante']};
const DEF_INS={nombre:['insumo','ingrediente','materia','nombre'],unidad:['unidad','medida'],costo:['costo'],cantidad:['cant','stock','existencia','tengo']};
function filasHoja(XLSX,ws){const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});let h=rows.findIndex(r=>r.some(c=>String(c).trim()));if(h<0)return{hdr:[],rows:[]};return{hdr:rows[h],rows:rows.slice(h+1)}}
function analizarExcel(XLSX,wb){
  const res={prods:[],ins:[],avisos:[]};
  const hojaP=wb.SheetNames.find(n=>/produc/i.test(n))||wb.SheetNames.find(n=>!/instruc|insum/i.test(n)),hojaI=wb.SheetNames.find(n=>/insum|ingred/i.test(n));
  if(hojaP){const {hdr,rows}=filasHoja(XLSX,wb.Sheets[hojaP]),m=colMap(hdr,DEF_PROD);
    if(m.nombre===undefined){res.avisos.push('No encontré la columna "Producto" en la hoja '+hojaP+'.')}
    else{const g={};rows.forEach((r,ix)=>{const nombre=String(r[m.nombre]??'').trim();if(!nombre)return;
      const precio=m.precio!==undefined?Math.round(numX(r[m.precio])):0;if(!precio){res.avisos.push(`Fila ${ix+2}: "${nombre}" no tiene precio, la salté.`);return}
      const k=normH(nombre);if(!g[k])g[k]={nombre,categoria:'',precio,filas:[]};const P=g[k];
      if(m.categoria!==undefined&&String(r[m.categoria]).trim())P.categoria=String(r[m.categoria]).trim();
      P.filas.push({talla:m.talla!==undefined?String(r[m.talla]??'').trim():'',color:m.color!==undefined?String(r[m.color]??'').trim():'',costo:m.costo!==undefined?Math.round(numX(r[m.costo])):0,cant:m.cantidad!==undefined?Math.max(0,Math.round(numX(r[m.cantidad]))):0})});
      res.prods=Object.values(g)}}
  if(hojaI){const {hdr,rows}=filasHoja(XLSX,wb.Sheets[hojaI]),m=colMap(hdr,DEF_INS);
    if(m.nombre!==undefined)rows.forEach(r=>{const nombre=String(r[m.nombre]??'').trim();if(!nombre)return;let u=normH(m.unidad!==undefined?r[m.unidad]:'und');
      u=/^(g|gr|gramo)/.test(u)?'g':/^(ml|mili)/.test(u)?'ml':/^(kg|kilo)/.test(u)?'kg':/^(l|lt|litro)/.test(u)?'l':'und';
      let costo=m.costo!==undefined?numX(r[m.costo]):0,cant=m.cantidad!==undefined?numX(r[m.cantidad]):0;
      if(u==='kg'){u='g';cant*=1000;costo/=1000}if(u==='l'){u='ml';cant*=1000;costo/=1000}
      res.ins.push({nombre,unidad:u,costo,cant})})}
  return res;
}
function aplicarImport(res){
  const ahora=Date.now(),nota='Inventario inicial (Excel)';let nuevos=0,actual=0,und=0;
  const ajuste=(iid,cant)=>{if(cant>0){const i=D.ins[iid];D.movs.push({id:uid(),tipo:'ajuste',fecha:ahora,insumoId:iid,nombre:i.nombre,unidad:U(i),cant,nota});und+=cant}};
  for(const P of res.prods){
    const vari=P.filas.filter(f=>f.talla||f.color),tallas=[...new Set(vari.map(f=>f.talla).filter(Boolean))].join(', '),colores=[...new Set(vari.map(f=>f.color).filter(Boolean))].join(', ');
    const vn=f=>f.talla&&f.color?f.talla+' · '+f.color:(f.talla||f.color);
    let p=Object.values(D.prod).find(x=>esRev(x)&&normH(x.nombre)===normH(P.nombre));
    if(!p){const costo0=(P.filas.find(f=>f.costo)||{}).costo||0;
      if(vari.length){const pid=crearReventa({nombre:P.nombre,categoria:P.categoria||(tallas?'Ropa':'Productos'),precio:P.precio,costo:costo0,tallas:vari.some(f=>f.talla&&f.color)||tallas?tallas:'',colores:vari.some(f=>f.talla&&f.color)||!tallas?colores:''});p=D.prod[pid];
        // dejar solo las combinaciones que vienen en el Excel
        const keep=new Set(vari.map(vn));p.variantes=p.variantes.filter(v=>{if(keep.has(v.nombre))return true;delete D.ins[v.ins];return false});
        for(const v of vari.map(vn).filter(x=>!p.variantes.find(y=>y.nombre===x))){const iid=uid()+'v';D.ins[iid]={id:iid,nombre:P.nombre+' · '+v,variante:v,unidad:'und',costo:costo0,minimo:1,orden:60,grupo:p.id};p.variantes.push({nombre:v,ins:iid})}}
      else{const pid=crearReventa({nombre:P.nombre,categoria:P.categoria||'Productos',precio:P.precio,costo:costo0});p=D.prod[pid]}
      nuevos++}
    else{p.precio=P.precio||p.precio;if(P.categoria)p.categoria=P.categoria;actual++}
    for(const f of P.filas){let iid;
      if(p.variantes){const nm=vn(f);let v=p.variantes.find(x=>x.nombre===nm);
        if(!v&&nm){const nid=uid()+'v';D.ins[nid]={id:nid,nombre:p.nombre+' · '+nm,variante:nm,unidad:'und',costo:f.costo,minimo:1,orden:60,grupo:p.id};v={nombre:nm,ins:nid};p.variantes.push(v)}
        iid=v?.ins}
      else iid=Object.keys(p.receta||{})[0];
      if(!iid||!D.ins[iid])continue;if(f.costo)D.ins[iid].costo=f.costo;ajuste(iid,f.cant)}
  }
  let insN=0;for(const I of res.ins){let i=Object.values(D.ins).find(x=>!x.grupo&&!x.variante&&normH(x.nombre)===normH(I.nombre));
    if(!i){const id=uid();i=D.ins[id]={id,nombre:I.nombre,unidad:I.unidad,costo:I.costo,minimo:I.unidad==='und'?3:200,orden:50};insN++}else if(I.costo)i.costo=I.costo;
    if(I.cant>0){D.movs.push({id:uid(),tipo:'ajuste',fecha:ahora,insumoId:i.id,nombre:i.nombre,unidad:U(i),cant:I.cant,nota})}}
  if(insN||res.ins.length){const m={...mods()};m.recetas=true;D.cfg.modulos=m}
  if(res.prods.some(P=>P.filas.some(f=>f.talla))){const m={...mods()};m.ropa=true;D.cfg.modulos=m}
  if(res.prods.length){const m={...mods()};m.reventa=m.reventa||res.prods.some(P=>!P.filas.some(f=>f.talla));D.cfg.modulos=m}
  return{nuevos,actual,und,insN};
}

function actualizarFactura(){let tot=0;
  document.querySelectorAll('#flines .fline').forEach(r=>{const n=r.dataset.n,nm=$('#fn_'+n).value.trim(),it=nm?insPorNombre(nm):null,u=it?U(it):$('#fu_'+n).value;

    const q=+$('#fq_'+n).value||0,pr=numIn($('#fp_'+n).value),sub=q*pr;tot+=sub;
    $('#fs_'+n).textContent=sub?money(sub):'';
    const cont=+$('#fc_'+n).value||1,cu=pr&&cont?pr/cont:0;
    $('#fi_'+n).textContent=(!nm?'':it?`Tienes ${qty(stock()[it.id]||0)} ${u}`:'Nuevo')+(q&&cu?`${nm?' · ':''}Entran ${qty(q*cont)} ${u} a ${moneyU(cu)} c/${u}`:'')});

function agruparFacturas(movs){const out=[],seen={};
  for(const m of movs){if(m.tipo==='compra'&&m.fid){if(seen[m.fid]){seen[m.fid].lineas.push(m);seen[m.fid].total+=+m.total||0;continue}
    const g={tipo:'factura',fid:m.fid,fecha:m.fecha,proveedor:m.proveedor,numfac:m.numfac,caja:m.caja,lineas:[m],total:+m.total||0};seen[m.fid]=g;out.push(g)}else out.push(m)}
  return out}

function vResumen(){
  const per=S.period,r=per==='mes'?rango('mes',S.mesOff):per==='anio'?rango('anio',0,S.anio):rango(per);
  const t=reales(r),movs=D.movs.filter(m=>(m.fecha||0)>=r.t0&&(m.fecha||0)<r.t1).sort((a,b)=>b.fecha-a.fecha);
  const top=Object.entries(t.porProd).sort((a,b)=>b[1]-a[1]),mx=top[0]?.[1]||1,lbl={venta:'Venta',compra:'Compra',gasto:'Gasto',ajuste:'Ajuste'};
  const nowY=new Date().getFullYear(),primerY=D.movs.length?new Date(Math.min(...D.movs.map(m=>m.fecha||Date.now()))).getFullYear():nowY;
  const nav=per==='mes'?`<div class="pnav"><button class="btn ghost" data-mnav="-1" aria-label="Mes anterior">‹</button><b>${r.label}</b><button class="btn ghost" data-mnav="1" aria-label="Mes siguiente" ${S.mesOff>=0?'disabled':''}>›</button></div>`
    :per==='anio'?`<div class="pnav"><button class="btn ghost" data-ynav="-1" aria-label="Año anterior" ${S.anio<=primerY?'disabled':''}>‹</button><b>${r.label}</b><button class="btn ghost" data-ynav="1" aria-label="Año siguiente" ${S.anio>=nowY?'disabled':''}>›</button></div>`:'';
  let tabla='';
  if(per==='anio'){const fm=fijosMes(),now=new Date(),filas=[];

function cargarLogo(f){if(!f)return;if(f.type&&!/^image\//.test(f.type)){toast('Ese archivo no es una imagen.');return}
  const url=URL.createObjectURL(f),img=new Image();

    const sc=Math.max(S2/img.width,S2/img.height),w=img.width*sc,h=img.height*sc;x.drawImage(img,(S2-w)/2,(S2-h)/2,w,h);

  fd=>{const r={...rc};F.forEach(([k])=>r[k]=String(fd.get(k)||'').trim());r.titulo=r.titulo||'RECIBO DE VENTA';r.consecutivo=Math.max(0,(+fd.get('next')||1)-1);D.cfg.recibo=r;
    if(save()){toast('Datos guardados. Ya salen en tus recibos.');if(volver)sheetRecibo(volver);else closeSheet()}});
}
function hexRGB(h){const n=parseInt(String(h).slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function makePdf(v){
  const {jsPDF}=window.jspdf,rc=RC(),tema={...(TEMAS[D.cfg.tema]||TEMAS.neon),...(D.cfg.colores||{})};
  const doc=new jsPDF({unit:'mm',format:'letter'}),W=215.9,M=16,Rr=W-M,BLACK=[21,21,19],AC=hexRGB(tema.accent),GRAY=[107,106,99],LINE=[226,225,218];
  const pesos=n=>{const x=Math.round(n||0);return (x<0?'-':'')+'$ '+new Intl.NumberFormat('es-CO').format(Math.abs(x))};
  let y=16;
  if(D.cfg.logo){try{doc.addImage(D.cfg.logo,D.cfg.logo.startsWith('data:image/png')?'PNG':'JPEG',M,y-3,16,16)}catch(e){}}
  const xN=D.cfg.logo?M+20:M;doc.setFont('helvetica','bold');doc.setFontSize(14);doc.setTextColor(...BLACK);doc.text(D.cfg.nombre||'',xN,y+4);
  doc.setFontSize(15);doc.text(rc.titulo||'RECIBO DE VENTA',Rr,y+3,{align:'right'});
  doc.setFontSize(11);doc.text('N° '+String(v.num||'').padStart(4,'0'),Rr,y+9,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...GRAY);doc.text('Fecha: '+new Date(v.fecha).toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'}),Rr,y+14,{align:'right'});
  y+=20;doc.setFillColor(...AC);doc.rect(M,y,Rr-M,1.6,'F');y+=8;
  const colW=(Rr-M-8)/2,xC=M+colW+8;
  const block=(x,title,ls)=>{doc.setFont('helvetica','bold');doc.setFontSize(8);doc.setTextColor(...GRAY);doc.text(title,x,y);let yy=y+5;
    ls.filter(l=>l&&l[1]).forEach(([b,t])=>{doc.setFont('helvetica',b?'bold':'normal');doc.setFontSize(b?11:9.5);doc.setTextColor(...BLACK);const w=doc.splitTextToSize(String(t),colW);doc.text(w,x,yy);yy+=w.length*(b?5:4.4)});return yy};
  const y1=block(M,'VENDEDOR',[[1,D.cfg.nombre],[0,rc.titular],[0,rc.documento&&('C.C./NIT: '+rc.documento)],[0,rc.telefono&&('Tel: '+rc.telefono)],[0,rc.correo],[0,[rc.direccion,rc.ciudad].filter(Boolean).join(', ')]]);
  const y2=block(xC,'CLIENTE',[[1,v.cliente||'Consumidor final'],[0,v.clienteDoc&&('C.C./NIT: '+v.clienteDoc)],[0,v.clienteTel&&('Tel: '+v.clienteTel)]]);
  y=Math.max(y1,y2)+5;
  const cols=[{t:'Producto',x:M+3,w:100,a:'left'},{t:'Cant.',x:M+120,a:'right'},{t:'Precio unit.',x:M+152,a:'right'},{t:'Total',x:Rr-3,a:'right'}];
  doc.setFillColor(...BLACK);doc.rect(M,y,Rr-M,8,'F');doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(255,255,255);
  cols.forEach(c=>doc.text(c.t,c.x,y+5.4,{align:c.a}));y+=8;
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...BLACK);
  (v.items||[]).forEach(it=>{const name=doc.splitTextToSize(((it.nombre||'')+(it.variante?' ('+it.variante+')':'')).replace(/·/g,'-'),cols[0].w),h=Math.max(8,name.length*4.4+3.6);if(y+h>245){doc.addPage();y=20}
    doc.text(name,cols[0].x,y+5.2);doc.text(String(it.cant),cols[1].x,y+5.2,{align:'right'});doc.text(pesos(it.precio),cols[2].x,y+5.2,{align:'right'});doc.text(pesos(it.cant*it.precio),cols[3].x,y+5.2,{align:'right'});
    y+=h;doc.setDrawColor(...LINE);doc.setLineWidth(.3);doc.line(M,y,Rr,y)});
  y+=8;const tl=Rr-70;
  doc.setFillColor(...AC);doc.rect(tl-4,y-4,Rr-tl+4,10,'F');doc.setFont('helvetica','bold');doc.setFontSize(12);doc.setTextColor(...hexRGB(textoSobre(tema.accent)));
  doc.text('TOTAL',tl,y+2.8);doc.text(pesos(v.total),Rr-3,y+2.8,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...GRAY);doc.text('Forma de pago:',M,y+2.8);doc.setTextColor(...BLACK);doc.text(pagoTxt(v),M+28,y+2.8);
  y+=18;
  if(rc.pagos){doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(...GRAY);doc.text('DATOS PARA PAGOS',M,y);y+=4.6;doc.setFont('helvetica','normal');doc.setFontSize(9.5);doc.setTextColor(...BLACK);const w=doc.splitTextToSize(rc.pagos,Rr-M);doc.text(w,M,y);y+=w.length*4.4+5}
  if(rc.nota){doc.setFont('helvetica','italic');doc.setFontSize(9.5);doc.setTextColor(...BLACK);doc.text(doc.splitTextToSize(rc.nota,Rr-M),M,y)}
  const fy=266;doc.setDrawColor(...AC);doc.setLineWidth(.8);doc.line(M,fy-5,Rr,fy-5);
  doc.setFont('helvetica','normal');doc.setFontSize(7.5);doc.setTextColor(...GRAY);
  doc.text([`${D.cfg.nombre||''}${rc.telefono?' | '+rc.telefono:''}${rc.correo?' | '+rc.correo:''}`,'Documento soporte de venta. No reemplaza la factura electrónica de la DIAN.'],W/2,fy,{align:'center'});
  return doc.output('blob');
}
async function entregarPdf(id,share){
  const v=D.movs.find(m=>m.id===id);if(!v)return;
  if(!window.jspdf){toast('No se pudo cargar el generador de PDF. Recarga la app.');return}
  const name=`Recibo_${String(v.num||'').padStart(4,'0')}_${(v.cliente||D.cfg.nombre||'cliente').replace(/[^\wáéíóúñÁÉÍÓÚÑ]+/g,'_')}.pdf`;
  let blob;try{blob=makePdf(v)}catch(e){console.error(e);toast('No se pudo crear el PDF.');return}
  const file=new File([blob],name,{type:'application/pdf'});
  try{if(share&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast(share?'Se descargó el PDF. Envíalo desde Descargas.':'Recibo descargado.');
}
function confirmar(t,fn){if(!t.dataset.armed){t.dataset.armed='1';t.textContent='¿Seguro? Toca otra vez';t.classList.add('danger');return}fn()}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-ins],[data-prod],[data-fijo],[data-vermes],[data-cierre],[data-cli],[data-factura]');if(!t)return;const d=t.dataset;
  if(d.tema){D.cfg.tema=d.tema;delete D.cfg.colores;save();aplicarTema();sheetAjustes();return}
  if(d.wmod||d.wej){if(d.wmod)S.wMods[d.wmod]=!S.wMods[d.wmod];else S.wEj=!S.wEj;const n=$('#wNombre')?.value;render();if(n)$('#wNombre').value=n;return}
  if(d.mod){const m={...mods()};m[d.mod]=!m[d.mod];if(!Object.values(m).some(Boolean)){toast('Deja al menos una opción activa.');return}D.cfg.modulos=m;save();sheetAjustes();return}
  if(d.pick){sheetElegir(d.pick);return}
  if(d.cierre){sheetCierre(d.cierre);return}
  if(d.delfac){if(S.confirmDel!==d.delfac){S.confirmDel=d.delfac;render();return}S.confirmDel=null;D.movs=D.movs.filter(m=>m.fid!==d.delfac);save();render();toast('Compra borrada');return}
  if(d.factura){sheetFactura(d.factura);return}
  if(d.quitarlinea!==undefined){const r=document.querySelector(`.fline[data-n="${d.quitarlinea}"]`);if(document.querySelectorAll('#flines .fline').length>1)r?.remove();else{r.querySelectorAll('input').forEach(i=>i.value='')}actualizarFactura();return}
  if(d.cli){sheetCliente(d.cli);return}
  if(d.delcm){if(S.confirmDel!==d.delcm){S.confirmDel=d.delcm;render();return}S.confirmDel=null;const c=cajaAbierta();if(c){c.movs=(c.movs||[]).filter(x=>x.id!==d.delcm);save()}render();return}
  if(d.pdf){entregarPdf(d.vid,d.pdf==='share');return}
  if(d.recibo){sheetRecibo(d.recibo);return}
  if(d.addv){S.cart[d.addv]=(S.cart[d.addv]||0)+1;sheetElegir(d.addv.split('|')[0]);return}
  if(d.tab){S.tab=d.tab;S.confirmDel=null;render();window.scrollTo(0,0);return}
  if(d.add){S.cart[d.add]=(S.cart[d.add]||0)+1;render();return}
  if(d.dec){S.cart[d.dec]=Math.max(0,(S.cart[d.dec]||0)-1);if(!S.cart[d.dec])delete S.cart[d.dec];render();return}
  if(d.per){S.period=d.per;if(d.per==='mes')S.mesOff=0;if(d.per==='anio')S.anio=new Date().getFullYear();render();return}
  if(d.mnav){S.mesOff=Math.min(0,S.mesOff+ +d.mnav);render();return}
  if(d.ynav){S.anio+= +d.ynav;render();return}
  if(d.vermes){S.period='mes';S.mesOff=+d.vermes;render();window.scrollTo(0,0);return}
  if(d.del){if(S.confirmDel!==d.del){S.confirmDel=d.del;render();return}S.confirmDel=null;D.movs=D.movs.filter(m=>m.id!==d.del);save();render();toast('Movimiento borrado');return}
  if(d.ins){sheetInsumo(d.ins);return} if(d.prod){sheetProducto(d.prod);return} if(d.fijo){sheetFijo(d.fijo);return}
  if(d.delins){confirmar(t,()=>{delete D.ins[d.delins];for(const p of Object.values(D.prod)){delete p.receta?.[d.delins];if(p.variantes)p.variantes=p.variantes.filter(v=>v.ins!==d.delins)}done('Eliminado')});return}
  if(d.delprod){confirmar(t,()=>{const p=D.prod[d.delprod];if(p){(p.variantes||[]).forEach(v=>delete D.ins[v.ins]);Object.keys(p.receta||{}).forEach(k=>{if(D.ins[k]?.grupo===p.id)delete D.ins[k]})}delete D.prod[d.delprod];Object.keys(S.cart).forEach(k=>{if(k.split('|')[0]===d.delprod)delete S.cart[k]});done('Producto eliminado')});return}
  if(d.delfijo){confirmar(t,()=>{const f=D.fijos[d.delfijo];if(!f){closeSheet();return}if(!f.hist)f.hist={'0000-00':+f.valor||0};const usado=Object.values(f.hist).some(v=>+v>0);if(usado){f.hist[mesHoy()]=0;f.archivado=true;f.valor=0}else delete D.fijos[d.delfijo];done('Gasto fijo eliminado desde este mes')});return}
  switch(d.act){
    case 'empezar':{const n=($('#wNombre').value||'').trim();if(!n){toast('Escribe el nombre de tu negocio.');$('#wNombre').focus();return}
      if(!Object.values(S.wMods).some(Boolean)){toast('Marca al menos una opción de lo que vendes.');return}
      iniciar(n,S.wMods,S.wEj);S.tab=S.wEj?'vender':'productos';render();toast('¡Listo! Crea tu primer producto');break}
    case 'close':closeSheet();break;
    case 'clearCart':S.cart={};render();break;
    case 'sell':sheetCobrar();break;
    case 'importar2':sheetImportar();break;
    case 'masIng':{const c=$('#nuevosIng'),n=c.children.length+(+Date.now()%1000)*10;c.insertAdjacentHTML('beforeend',filaNuevoIng(n));$('#nn_'+n).focus();break}
    case 'plantilla':descargarPlantilla();break;
    case 'subirExcel':$('#excelFile').click();break;
    case 'confirmarImport':{if(!IMPORT)return;const r=aplicarImport(IMPORT);IMPORT=null;if(save()){toast(`Listo: ${r.nuevos} nuevos, ${r.actual} actualizados, ${r.und} unidades`);S.tab='inventario';closeSheet()}break}
    case 'abrirCaja':{const v=$('#cjBase').value.replace(/\D/g,'');if(v===''){toast('Escribe con cuánto efectivo arrancas (puede ser 0).');$('#cjBase').focus();return}
      D.cajas=D.cajas||[];D.cajas.push({id:uid(),abierta:Date.now(),cerrada:null,base:+v||0,movs:[]});if(save()){toast('Caja abierta con '+money(+v||0));S.tab='vender';render()}break}
    case 'cajaIngreso':sheetCajaMov('ingreso');break;
    case 'cajaRetiro':sheetCajaMov('retiro');break;
    case 'cerrarCaja':sheetCerrarCaja();break;
    case 'datosRecibo':sheetDatosRecibo(d.volver);break;
    case 'compra':sheetCompra();break;
    case 'compraTallas':sheetCompraTallas();break;
    case 'masLinea':{$('#flines').insertAdjacentHTML('beforeend',lineaFactura(FL));$('#fn_'+FL).focus();FL++;actualizarFactura();break}
    case 'nuevoIns':sheetInsumo();break;
    case 'nuevoProd':sheetProducto();break;
    case 'nuevoReventa':sheetReventa();break;
    case 'nuevaPrenda':sheetReventa(null,'ropa');break;
    case 'nuevoFijo':sheetFijo();break;
    case 'gasto':sheetGasto();break;
    case 'ajustes':sheetAjustes();break;
    case 'exportar':exportar();break;
    case 'importar':$('#importFile').click();break;
    case 'subirLogo':$('#logoFile').click();break;
    case 'quitarLogo':delete D.cfg.logo;save();render();sheetAjustes();toast('Logo quitado');break;
    case 'borrarTodo':confirmar(t,()=>{try{localStorage.removeItem(KEY)}catch(e){}D=blank();S.cart={};$('#sheet').hidden=true;render()});break;
  }
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('input',e=>{const el=e.target;if(!el.classList||!el.classList.contains('money'))return;
  const pos=el.selectionStart??el.value.length,derecha=el.value.slice(pos).replace(/\D/g,'').length,dig=el.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');
  const out=dig?(+dig).toLocaleString('es-CO'):'';if(out===el.value)return;el.value=out;
  let k=out.length,c=0;while(k>0&&c<derecha){k--;if(/\d/.test(out[k]))c++}try{el.setSelectionRange(k,k)}catch(_){}
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
